name: CI

# 设计要点（改造方案 P7.1）：
#   把「评测 99%」从**一次性结论**变成**持续保证** —— 这是"工程能力"与
#   "跑过一次脚本"的分水岭。
#
# 分层策略（关键）：
#   本工作流只跑**不依赖外部服务**的部分（hermetic 单测 + 前端构建），
#   因此不需要 API Key、不需要 Qdrant/PG 容器，零成本、天然稳定。
#   需要真实 LLM / 数据库的测试由 skipif 自动跳过。
#
#   2026-10-21 实测（无 Key + 服务端口不可达）：745 passed, 147 skipped，合计 892 例。
#   这两个数字由下方「断言测试集合未被静默削减」step 以**下限**方式守卫，
#   新增测试不需要改 CI，但删除或改坏集成测试会立即失败。
#   真链路验证走本地闸口 `scripts/check.ps1 -Full`（含检索评测逐题基线比对）。

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: 后端单测（hermetic）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 项目依赖 + 测试依赖（PEP 735 dependency-groups 需 pip>=25.1）
          pip install -e . || pip install .
          pip install pytest pytest-asyncio

      - name: 语法自检（compileall）
        run: python -m compileall -q app eval tests

      - name: 单测（不依赖外部服务；集成测试自动跳过）
        env:
          # 刻意留空：让需要真实 LLM/DB 的测试自动 skip，
          # 而不是失败。CI 不该依赖付费 API 与外部容器。
          SILICONFLOW_API_KEY: ""
          POSTGRES_HOST: "127.0.0.1"
          QDRANT_HOST: "127.0.0.1"
        run: |
          mkdir -p ../output
          python -m pytest -q --no-header -rs --junitxml=../output/ci-tests.xml

      - name: 断言测试集合未被静默削减
        # 防止"集成测试被静默删掉/改坏"导致 CI 假绿。
        #
        # 原实现只有 `pytest | tail -1` + 一句 notice，名字叫断言却没有任何数值比较，
        # 且重复跑了一遍全量测试（约 3 分钟）。现改为解析上一步的 junit 报告做真断言。
        #
        # 采用**下限**守卫：新增测试不需要改 CI；一旦集成测试被删除或改坏，
        # skipped 与总数会跌破下限并立即失败。下限取自 2026-10-20 实测值
        # （725 passed, 147 skipped，合计 872）并留出小幅余量。
        env:
          MIN_SKIPPED: "140"
          MIN_TOTAL: "860"
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          path = "../output/ci-tests.xml"
          root = ET.parse(path).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              sys.exit("无法在 junit 报告中找到 testsuite 节点")

          n = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(f"junit 统计: {n}")

          problems = []
          if n["failures"] or n["errors"]:
              problems.append(f"存在 {n['failures']} 个失败、{n['errors']} 个错误")
          if n["skipped"] < int(os.environ["MIN_SKIPPED"]):
              problems.append(
                  f"跳过数 {n['skipped']} 低于下限 {os.environ['MIN_SKIPPED']}，"
                  "集成测试可能被静默删除或因缺少 skipif 而变成假通过"
              )
          if n["tests"] < int(os.environ["MIN_TOTAL"]):
              problems.append(
                  f"测试总数 {n['tests']} 低于下限 {os.environ['MIN_TOTAL']}，测试集合发生了非预期缩减"
              )
          if problems:
              print("::error::" + "；".join(problems))
              sys.exit(1)

          print("::notice::测试集合完整，无静默削减；集成测试按设计跳过。"
                "真链路验证走 scripts/check.ps1 -Full")
          PY

      - name: 答案质量评测器自检（合成正反例，不代表真实模型成绩）
        run: python -m eval.quality_calibration --output ../output/quality_self_check.json

      - name: 保存评测器自检报告
        uses: actions/upload-artifact@v4
        with:
          name: quality-evaluator-self-check
          path: output/quality_self_check.json

      - name: 并发与流式测量工具自检（本地夹具，非生产容量）
        run: python -m eval.performance --mode fixture --requests 4 --concurrency 1,2 --warmup 1 --output ../output/performance_fixture.json

      - name: 保存性能测量工具自检报告
        uses: actions/upload-artifact@v4
        with:
          name: performance-fixture-self-check
          path: output/performance_fixture.json

  frontend-build:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建（vue-tsc --noEmit && vite build）
        run: npm run build

  sql-guard:
    name: SQL 安全闸口（攻击载荷回归）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e . || pip install .
          pip install pytest pytest-asyncio

      - name: SQL 安全网关攻击载荷测试
        # 单独成一个 job：安全回归失败必须是**显眼**的，
        # 不能混在几百条单测里被忽略。
        run: |
          python -m pytest tests/test_sql_guard.py \
                           tests/test_text2sql_metric.py \
                           -v --no-header
