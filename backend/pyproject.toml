[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-backend"
version = "0.1.0"
description = "Enterprise RAG backend (FastAPI, front-back separated)"
requires-python = ">=3.12"
dependencies = [
    # Web / ASGI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # 配置 / 校验
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # HTTP 客户端（关键路径异步）
    "httpx>=0.27.0",
    "requests>=2.31.0",
    # 向量库
    "qdrant-client>=1.13.0",
    # 文档解析
    "pymupdf>=1.26.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "pdfplumber>=0.11.0",
    "jieba>=0.42.1",
    # 持久化（P3）
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    # 缓存 / 队列（P3 + P4）
    "redis>=5.0.0",
    "arq>=0.26",
    # Text2SQL 安全（P2）：SQL AST 白名单校验 + 标识符转义 + LIMIT 注入
    # 选型理由：MIT、零依赖纯 Python、Postgres 属 Official 支持级别；
    # 且自带内存执行引擎（sqlglot.executor），可让 SQL 单测不依赖 PostgreSQL。
    # ⚠️ 官方 FAQ 明确声明 "SQLGlot is a transpiler, not a validator"，
    #    因此它只是四层防御中的第一层，不能作为唯一安全边界。
    "sqlglot>=30.0.0",
    # 可观测
    "langfuse>=3.0.0",
]

# 测试依赖：用 PEP 735 dependency-groups 声明（而非 optional-dependencies extras），
# 因为 uv sync / uv run 默认同步 dev 组而不含 extras——否则 PyCharm 装入的 pytest 会被
# uv run 的隐式 sync 反复卸载，形成"每次启动卸 N 装 N"的互搏循环。
# 注意：Dockerfile 用 `pip install .` 构建镜像，pip 忽略本节，生产镜像仍不含测试依赖。
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["data/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
